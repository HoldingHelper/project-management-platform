steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, --label, 'org.opencontainers.image.revision=${_SHA}', -t, 'europe-west1-docker.pkg.dev/ava-persian/ava-persian-api/pmp-api:server-${_SHA}', backend]
  - name: gcr.io/cloud-builders/docker
    args: [build, --label, 'org.opencontainers.image.revision=${_SHA}', --build-arg, INTERNAL_API_URL=http://api:8000, --build-arg, NEXT_PUBLIC_WS_URL=, -t, 'europe-west1-docker.pkg.dev/ava-persian/ava-persian-api/pmp-frontend:server-${_SHA}', frontend]
  - name: gcr.io/cloud-builders/docker
    entrypoint: sh
    args: [-c, 'docker save europe-west1-docker.pkg.dev/ava-persian/ava-persian-api/pmp-api:server-${_SHA} europe-west1-docker.pkg.dev/ava-persian/ava-persian-api/pmp-frontend:server-${_SHA} | gzip -1 > /workspace/pmp-images.tar.gz']
artifacts:
  objects:
    location: 'gs://pmp-server-releases-ava-persian/${_SHA}/'
    paths: [pmp-images.tar.gz]
images:
  - 'europe-west1-docker.pkg.dev/ava-persian/ava-persian-api/pmp-api:server-${_SHA}'
  - 'europe-west1-docker.pkg.dev/ava-persian/ava-persian-api/pmp-frontend:server-${_SHA}'
serviceAccount: projects/ava-persian/serviceAccounts/pmp-ci-builder@ava-persian.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 2400s
