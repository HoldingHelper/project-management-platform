stages: [verify, deploy]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

frontend-check:
  stage: verify
  image: node:22-bookworm-slim
  tags: [avenour-build]
  timeout: 30m
  retry: 1
  variables:
    NEXT_TELEMETRY_DISABLED: "1"
  script:
    - cd frontend
    - npm ci --no-audit --no-fund
    - npm run typecheck
    - npm test
    - npm run build

deploy-production:
  stage: deploy
  image: google/cloud-sdk:slim@sha256:b38f2881552c3054d140c8eeb4ad88bdc0eb4deeeb38507c5dac1403adc3ee64
  tags: [avenour-deploy]
  timeout: 90m
  resource_group: pmp-production
  interruptible: false
  environment:
    name: production
    url: https://pmp.avenourgroup.com
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://iam.googleapis.com/projects/706796253833/locations/global/workloadIdentityPools/pmp-gitlab/providers/gitlab
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE =~ /^(push|web|api)$/ '
    - when: never
  script:
    - bash scripts/ci/deploy-production.sh
