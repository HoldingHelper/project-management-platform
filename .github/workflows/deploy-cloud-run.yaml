name: Deploy Project Management Platform to Cloud Run

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloud-run-pmp
  cancel-in-progress: false

env:
  PROJECT_ID: ava-persian
  REGION: europe-west1
  GAR_REPOSITORY: ava-persian-api
  API_SERVICE_NAME: pmp-api
  FRONTEND_SERVICE_NAME: pmp-frontend
  CLOUD_SQL_INSTANCE: ava-persian:europe-west1:pmp-postgres

jobs:
  deploy-api:
    name: Build & Deploy API to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      api_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          credentials_json: '${{ secrets.GCP_KEY_JSON }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push API Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.API_SERVICE_NAME }}:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.API_SERVICE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy API to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          service: ${{ env.API_SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.API_SERVICE_NAME }}:${{ github.sha }}
          env_vars: |
            ENVIRONMENT=production
            DEBUG=false
            APP_NAME=Project Management Platform API
            RUN_MIGRATIONS_ON_STARTUP=true
            INIT_ADMIN_ON_STARTUP=true
            SKIP_DB_WAIT=true
            POSTGRES_HOST=/cloudsql/${{ env.CLOUD_SQL_INSTANCE }}
            S3_ENDPOINT_URL=https://storage.googleapis.com
            S3_BUCKET=pmp-storage-ava-persian
            S3_REGION=europe-west1
            S3_USE_SSL=true
            REALTIME_BACKPLANE_ENABLED=false
          secrets: |
            DATABASE_URL=pmp-database-url:latest
            JWT_SECRET=pmp-jwt-secret:latest
            SEED_ADMIN_PASSWORD=pmp-seed-admin-password:latest
            S3_ACCESS_KEY=pmp-s3-access-key:latest
            S3_SECRET_KEY=pmp-s3-secret-key:latest
          flags: |
            --allow-unauthenticated
            --ingress=all
            --port=8000
            --memory=2Gi
            --cpu=2
            --concurrency=80
            --timeout=300
            --add-cloudsql-instances=${{ env.CLOUD_SQL_INSTANCE }}

      - name: Verify Deployed API
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 10 \
            --max-time 30 \
            "${{ steps.deploy.outputs.url }}/health"

  deploy-frontend:
    name: Build & Deploy Frontend to Cloud Run
    needs: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          credentials_json: '${{ secrets.GCP_KEY_JSON }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            INTERNAL_API_URL=${{ needs.deploy-api.outputs.api_url }}
            NEXT_PUBLIC_WS_URL=wss://${{ steps.get-host.outputs.host }}/ws
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.FRONTEND_SERVICE_NAME }}:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.FRONTEND_SERVICE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Frontend to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          service: ${{ env.FRONTEND_SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.FRONTEND_SERVICE_NAME }}:${{ github.sha }}
          env_vars: |
            INTERNAL_API_URL=${{ needs.deploy-api.outputs.api_url }}
            NODE_ENV=production
          flags: |
            --allow-unauthenticated
            --ingress=all
            --port=3000
            --memory=1Gi
            --cpu=1
            --concurrency=80
            --timeout=300

      - name: Verify Deployed Frontend
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 10 \
            --max-time 30 \
            "${{ steps.deploy.outputs.url }}"
